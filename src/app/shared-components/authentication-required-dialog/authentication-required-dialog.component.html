<div class="dialog-container">
  <button
    mat-icon-button
    type="button"
    class="close-button"
    aria-label="Închide"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>

  <div class="dialog-icon">
    <mat-icon>lock</mat-icon>
  </div>

  <h2>Autentificare necesară</h2>

  <p class="dialog-message">
    {{ data.message }}
  </p>

  <div class="dialog-actions">
    <button
      mat-flat-button
      type="button"
      class="login-button"
      (click)="goToLogin()"
    >
      <mat-icon>login</mat-icon>
      Autentificare
    </button>

    <button
      mat-stroked-button
      type="button"
      class="register-button"
      (click)="goToRegister()"
    >
      Creează un cont nou
    </button>
  </div>
</div>
