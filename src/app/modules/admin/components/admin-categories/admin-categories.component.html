<div class="categories-page">
  <div class="page-header">
    <div>
      <h1>Categorii</h1>

      <p>Gestionează categoriile disponibile pentru cărțile din BookLoop.</p>
    </div>

    <button
      mat-flat-button
      type="button"
      class="admin-primary-button"
      (click)="openCreateDialog()"
    >
      <mat-icon>add</mat-icon>
      Adaugă categorie
    </button>
  </div>

  <div class="categories-toolbar">
    <span class="results-count">
      {{ totalElements }}
      {{ totalElements === 1 ? "categorie" : "categorii" }}
    </span>
  </div>

  <ng-container *ngIf="!isLoading">
    <div class="categories-card" *ngIf="categories.length > 0; else emptyState">
      <div
        class="categories-table"
        matSort
        [matSortActive]="sortBy"
        [matSortDirection]="sortDirection"
        (matSortChange)="onSortChange($event)"
      >
        <div class="table-header">
          <div mat-sort-header="categoryName">Categorie</div>

          <div class="actions-header">Acțiuni</div>
        </div>

        <div
          class="category-row"
          *ngFor="let category of categories; trackBy: trackByCategoryId"
        >
          <div class="category-cell">
            <strong>
              {{ category.categoryName }}
            </strong>
          </div>

          <div class="actions-cell">
            <button
              mat-icon-button
              type="button"
              matTooltip="Editează categoria"
              (click)="openEditDialog(category)"
            >
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              type="button"
              class="delete-button"
              matTooltip="Șterge categoria"
              (click)="openDeleteDialog(category)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>

      <mat-paginator
        [length]="totalElements"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        [showFirstLastButtons]="true"
        (page)="onPageChange($event)"
      >
      </mat-paginator>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <div class="empty-state">
      <mat-icon>category</mat-icon>

      <h2>Nu există categorii</h2>

      <p>Adaugă prima categorie pentru cărțile din BookLoop.</p>

      <button
        mat-flat-button
        type="button"
        class="admin-primary-button"
        (click)="openCreateDialog()"
      >
        <mat-icon>add</mat-icon>
        Adaugă categorie
      </button>
    </div>
  </ng-template>
</div>
