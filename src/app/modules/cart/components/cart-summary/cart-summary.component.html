<div class="summary-card">
  <h2>Sumar comandă</h2>

  <div class="summary-row">
    <span> Produse ({{ totalItems }}) </span>

    <strong>
      {{ subtotal | currency: "RON" : "symbol" : "1.2-2" }}
    </strong>
  </div>

  <div class="summary-row">
    <span>Livrare</span>

    <strong>
      <ng-container *ngIf="shippingPrice > 0; else freeShipping">
        {{ shippingPrice | currency: "RON" : "symbol" : "1.2-2" }}
      </ng-container>

      <ng-template #freeShipping> Gratuit </ng-template>
    </strong>
  </div>

  <div class="summary-divider"></div>

  <div class="summary-row total">
    <span>Total</span>

    <strong>
      {{ totalPrice | currency: "RON" : "symbol" : "1.2-2" }}
    </strong>
  </div>
</div>
