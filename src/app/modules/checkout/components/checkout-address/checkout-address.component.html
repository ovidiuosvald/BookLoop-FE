<div class="address-card">
  <app-checkout-section-header
    [step]="1"
    title="Adresa de livrare"
    description="Alege o adresă salvată sau completează una nouă."
  >
  </app-checkout-section-header>

  <ng-container *ngIf="addresses.length > 0; else emptyState">
    <div class="saved-addresses">
      <button
        type="button"
        class="saved-address"
        *ngFor="let address of addresses; trackBy: trackByAddressId"
        [class.selected]="selectedAddressId === address.addressId"
        (click)="selectAddress(address.addressId!)"
      >
        <mat-icon class="selection-icon">
          {{
            selectedAddressId === address.addressId
              ? "radio_button_checked"
              : "radio_button_unchecked"
          }}
        </mat-icon>

        <div class="address-content">
          <div class="address-title">
            <strong>
              {{ address.firstName }}
              {{ address.lastName }}
            </strong>

            <span class="default-badge" *ngIf="address.isDefault">
              Implicită
            </span>
          </div>

          <p>
            {{ address.addressLine }}
          </p>

          <p>
            {{ address.city }},
            {{ address.county }}
            <ng-container *ngIf="address.postalCode">
              · {{ address.postalCode }}
            </ng-container>
          </p>

          <span class="phone">
            <mat-icon>phone</mat-icon>

            {{ address.phoneNumber }}
          </span>
        </div>
      </button>
    </div>

    <button
      mat-stroked-button
      type="button"
      class="new-address-button"
      *ngIf="!showNewAddressForm"
      (click)="showAddressForm()"
    >
      <mat-icon>add</mat-icon>

      Folosește o adresă nouă
    </button>
  </ng-container>

  <ng-template #emptyState>
    <div class="empty-addresses" *ngIf="!showNewAddressForm">
      <mat-icon>location_off</mat-icon>

      <h3>Nu ai adrese salvate</h3>

      <p>Completează prima adresă pentru livrarea comenzii.</p>

      <button
        mat-flat-button
        type="button"
        class="add-first-address-button"
        (click)="showAddressForm()"
      >
        <mat-icon>add</mat-icon>

        Adaugă adresă
      </button>
    </div>
  </ng-template>

  <div *ngIf="showNewAddressForm" class="new-address-form" [formGroup]="form">
    <div class="form-header">
      <div>
        <h3>Adresă nouă</h3>

        <p>Completează datele necesare pentru livrare.</p>
      </div>

      <button
        *ngIf="addresses.length > 0"
        mat-icon-button
        type="button"
        aria-label="Închide formularul pentru adresă nouă"
        (click)="cancelNewAddress()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <app-address-form [form]="form"></app-address-form>

    <div class="save-address-option">
      <mat-checkbox color="primary" formControlName="saveDeliveryAddress">
        Salvează această adresă pentru comenzile viitoare
      </mat-checkbox>

      <mat-checkbox
        *ngIf="form.get('saveDeliveryAddress')?.value"
        color="primary"
        formControlName="isDefault"
        class="default-checkbox"
      >
        Setează ca adresă implicită
      </mat-checkbox>
    </div>
  </div>
</div>
