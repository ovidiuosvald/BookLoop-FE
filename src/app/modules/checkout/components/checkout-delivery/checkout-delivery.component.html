<mat-card class="delivery-card">
  <app-checkout-section-header
    [step]="2"
    title="Livrare"
    description="Alege modalitatea prin care dorești să primești comanda."
  ></app-checkout-section-header>

  <div [formGroup]="form">
    <mat-radio-group class="delivery-options" formControlName="method">
      <div
        class="delivery-option"
        [class.selected]="form.get('method')?.value === deliveryMethod.Courier"
        (click)="selectMethod(deliveryMethod.Courier)"
      >
        <mat-radio-button
          color="primary"
          [value]="deliveryMethod.Courier"
          (click)="$event.stopPropagation()"
        ></mat-radio-button>

        <div class="option-content">
          <div class="option-title">
            <mat-icon>local_shipping</mat-icon>
            <span>Livrare prin curier</span>
          </div>

          <p>Comanda va fi livrată la adresa selectată.</p>
        </div>

        <strong class="delivery-price">12,90 lei</strong>
      </div>

      <div
        class="delivery-option"
        [class.selected]="form.get('method')?.value === deliveryMethod.Pickup"
        (click)="selectMethod(deliveryMethod.Pickup)"
      >
        <mat-radio-button
          color="primary"
          [value]="deliveryMethod.Pickup"
          (click)="$event.stopPropagation()"
        ></mat-radio-button>

        <div class="option-content">
          <div class="option-title">
            <mat-icon>storefront</mat-icon>
            <span>Ridicare din librărie</span>
          </div>

          <p>BookLoop, Str. Matei Corvin nr. 46, Oradea.</p>
        </div>

        <strong class="delivery-price free">Gratuit</strong>
      </div>
    </mat-radio-group>
  </div>
</mat-card>
